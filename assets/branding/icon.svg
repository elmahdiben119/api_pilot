<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    API Pilot: master launcher icon (background + glyph).
    Used for the legacy launcher icon (Android 7.x) and as the large preview.
    The glyph must stay identical to icon-foreground.svg (here scaled 1.15x).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14386B"/>
      <stop offset="1" stop-color="#0A1C36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2FB8FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2FB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bracket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B95FF"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="heading" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#19C2E6"/>
      <stop offset="1" stop-color="#5EF0FF"/>
    </linearGradient>
  </defs>

  <g id="background">
    <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="400" fill="url(#glow)"/>
  </g>

  <g id="glyph" transform="translate(512 512) scale(1.15) translate(-512 -546)"
     fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline id="bracket-left" points="364,420 240,550 364,680" stroke="url(#bracket)" stroke-width="64"/>
    <polyline id="bracket-right" points="660,420 784,550 660,680" stroke="url(#bracket)" stroke-width="64"/>
    <g id="heading-arrow" stroke="url(#heading)">
      <line id="shaft" x1="476" y1="684" x2="569" y2="454" stroke-width="64"/>
      <polygon id="head" points="597.5,383.6 617.2,484.4 513.4,442.4" fill="url(#heading)" stroke-width="16"/>
    </g>
  </g>
</svg>
