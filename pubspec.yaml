name: api_pilot
description: "API Pilot - a mobile API client: REST, GraphQL, environments, collections, history and JSONPath."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  cupertino_icons: ^2.0.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.5.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
